<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4ecd9">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Decemberresan · Sri Lanka, vår resa & allt runtomkring</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="atlas" class="route-view" aria-label="Interaktiv illustrationskarta över Sri Lanka">
    <div id="map-surface" aria-hidden="true"></div>
    <div id="world" aria-hidden="true">
      <img id="artwork" src="assets/atlas.png" alt="" width="1536" height="1024" draggable="false">
      <svg id="routes" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024"></svg>
    </div>
    <svg id="leaders" aria-hidden="true"></svg>
    <div id="figure-hotspots" aria-label="Klickbara illustrationer"></div>
    <div id="labels" aria-label="Platser och resvägar"></div>

    <header class="map-title">
      <h1>Sri Lanka</h1>
      <div class="title-rule" aria-hidden="true"><span></span><svg viewBox="0 0 34 28"><path d="M17 26V10m0 0C9 2 3 7 2 13c5-5 10-4 15-3Zm0 0C21 0 29 3 32 8c-6-2-11-1-15 2Zm0 0C9-1 14-2 20 2m-3 8C9 8 7 17 7 19c4-5 7-7 10-9Zm0 0c9-3 13 5 13 9-4-5-8-7-13-9Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><span></span></div>
      <p>Vår preliminära resplan</p>
    </header>

    <nav class="filters" aria-label="Välj kartvy">
      <button data-view="route" aria-pressed="true"><span class="view-dot route-dot" aria-hidden="true"></span>Vår rutt</button>
      <button data-view="explore" aria-pressed="false"><span class="view-dot extra-dot" aria-hidden="true">+</span>Rutt + tillval</button>
    </nav>

    <section class="journey-strip" aria-label="Resordning från ankomst till avresa">
      <div class="journey-heading"><strong>Vi åker så här</strong><span>6 stopp · tryck eller svep →</span></div>
      <ol id="journey-stops" class="journey-stops"></ol>
    </section>

    <div class="explore-controls" hidden>
      <label for="extra-category">Tillval utanför rutten</label>
      <select id="extra-category">
        <option value="all">Alla tillval</option>
        <option value="nature">Natur &amp; djur</option>
        <option value="culture">Kultur &amp; historia</option>
        <option value="coast">Strand &amp; hav</option>
      </select>
    </div>

    <section class="map-legend" aria-label="Teckenförklaring">
      <div><i class="road-key"></i><span>Bil · vår rutt</span><i class="train-key"></i><span>Tåg · förslag</span></div>
      <p id="view-explanation">Bara vår rutt är markerad. Övriga figurer är tillval.</p>
    </section>

    <div class="map-tools" aria-label="Kartverktyg">
      <button id="zoom-out" aria-label="Zooma ut">−</button>
      <button id="zoom-in" aria-label="Zooma in">+</button>
      <button id="fit-map" aria-label="Visa hela kartan" title="Visa hela kartan"><svg viewBox="0 0 24 24" fill="none"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M8 12h8m-4-4v8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="fit-route" aria-label="Visa vår rutt" title="Visa vår rutt"><svg viewBox="0 0 24 24" fill="none"><circle cx="6" cy="6" r="2" stroke="currentColor" stroke-width="1.6"/><circle cx="18" cy="18" r="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 6h6a4 4 0 0 1 0 8H9a4 4 0 0 0 0 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </div>

    <section id="place-card" class="place-card" hidden aria-labelledby="card-title" tabindex="-1">
      <button id="close-card" class="close-card" aria-label="Stäng platsinformation"><svg viewBox="0 0 20 20" fill="none"><path d="m5 5 10 10M15 5 5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      <div id="card-status" class="card-status"></div>
      <h2 id="card-title"></h2>
      <p id="card-subtitle" class="card-subtitle"></p>
      <p id="card-description"></p>
      <div id="card-metric" class="card-metric" hidden></div>
      <p id="card-note" class="card-note"></p>
    </section>

    <div class="map-footnote"><button id="about-map">Om kartan</button><span>Schematisk karta · ungefärliga tider</span></div>
    <div id="live-status" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
